    // Main response generator
    generateResponse(question) {
        const q = question.toLowerCase();
        
        // Apps overview
        if (q.includes('تطبيقات') || q.includes('منتجات') || q.includes('برامج')) {
            return this.generateAppsOverview();
        }
        
        // Pricing
        if (q.includes('سعر') || q.includes('تكلفة') || q.includes('ثمن') || q.includes('price')) {
            return this.generatePricingInfo();
        }
        
        // Zoho One
        if (q.includes('zoho one') || q.includes('باقة') || q.includes('شاملة')) {
            return this.generateZohoOneInfo();
        }
        
        // Industry-specific
        if (q.includes('تصنيع') || q.includes('مصنع')) return this.generateIndustrySolution('manufacturing');
        if (q.includes('تجزئة') || q.includes('تجارة') || q.includes('ecommerce')) return this.generateIndustrySolution('retail');
        if (q.includes('خدمات') || q.includes('استشارات')) return this.generateIndustrySolution('services');
        
        // Specific apps
        if (q.includes('crm') || q.includes('علاقات عملاء')) return this.generateAppInfo('crm');
        if (q.includes('inventory') || q.includes('مخزون')) return this.generateAppInfo('inventory');
        if (q.includes('books') || q.includes('محاسبة')) return this.generateAppInfo('books');
        if (q.includes('desk') || q.includes('دعم')) return this.generateAppInfo('desk');
        if (q.includes('workplace') || q.includes('تعاون')) return this.generateAppInfo('workplace');
        if (q.includes('sites') || q.includes('موقع')) return this.generateAppInfo('sites');
        
        // Competitor comparison
        if (q.includes('مقارنة') || q.includes('منافس') || q.includes('salesforce')) {
            return this.generateCompetitorAnalysis();
        }
        
        // Benefits & ROI
        if (q.includes('فوائد') || q.includes('مميزات') || q.includes('roi') || q.includes('عائد')) {
            return this.generateBenefitsROI();
        }
        
        // Default welcome
        return this.generateWelcome();
    }

    async getResponse(question) {

// Initialize assistant
const assistant = new ZohoAssistant();

// Chat interface functions
function addMessage(content, isUser = false) {
    const messagesDiv = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
    messageDiv.innerHTML = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                .replace(/
/g, '<br>');
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('userInput');
    const question = input.value.trim();
    
    if (!question) return;
    
    addMessage(question, true);
    input.value = '';
    
    // Show typing indicator
    addMessage('🤔 جاري التفكير...', false);
    
    try {
        const response = await assistant.getResponse(question);
        // Remove typing indicator and add actual response
        const messages = document.querySelectorAll('.message');
        messages[messages.length - 1].remove();
        addMessage(response, false);
    } catch (error) {
        const messages = document.querySelectorAll('.message');
        messages[messages.length - 1].remove();
        addMessage('عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.', false);
    }
}

// Handle Enter key
document.getElementById('userInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});

// Welcome message on load
window.onload = function() {
    addMessage(assistant.generateWelcome(), false);
};
</script>
