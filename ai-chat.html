<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>e& Smart - Zoho AI Chat</title>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f9f9f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .chat-container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .chat-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #0077b6;
      text-align: center;
    }
    #chatBox {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
    }
    .message {
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      line-height: 1.6;
    }
    .user {
      background-color: #e0f7fa;
      text-align: right;
    }
    .bot {
      background-color: #f1f1f1;
      text-align: left;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #0077b6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005f8f;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-title">🤖 مساعد Zoho الذكي - e& مصر</div>
    <div id="chatBox"></div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." />
      <button onclick="handleSend()">إرسال</button>
    </div>
  </div>

  <script>
    // ✅ AI Logic from New chat logic.txt
    // Paste the full ZOHO_KNOWLEDGE object and all generator functions here
    // Then include this final responder:

    async function getSimulatedResponse(question) {
      await new Promise(resolve => setTimeout(resolve, 1000 + Math.random() * 1000));
      return generateComprehensiveResponse(question);
    }

    // ✅ Send Button Logic
    async function handleSend() {
      const input = document.getElementById("userInput").value.trim();
      if (!input) return;

      const chatBox = document.getElementById("chatBox");

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = input;
      chatBox.appendChild(userMessage);

      const botMessage = document.createElement("div");
      botMessage.className = "message bot";
      botMessage.textContent = "جارٍ التحليل...";
      chatBox.appendChild(botMessage);

      const reply = await getSimulatedResponse(input);
      botMessage.textContent = reply;

      document.getElementById("userInput").value = "";
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
