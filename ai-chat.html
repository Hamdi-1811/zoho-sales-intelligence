<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e& Smart - المساعد الذكي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
  <style>
    :root {
      --zoho-red: #E42527;
      --zoho-dark: #1A1A1A;
      --zoho-gray: #F5F5F5;
      --zoho-gold: #FFB81C;
      --white: #FFFFFF;
      --text-secondary: #666666;
      --border-color: #E0E0E0;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--zoho-gray);
      color: var(--zoho-dark);
      line-height: 1.6;
    }
    .header {
      background-color: var(--white);
      padding: 15px 0;
      box-shadow: 0 2px 10px var(--shadow-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-container {
      display: flex;
      gap: 30px;
      align-items: center;
    }
    .logo {
      height: 50px;
      object-fit: contain;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--zoho-dark);
      font-weight: 600;
    }
    .user-info i {
      font-size: 1.5rem;
      color: var(--zoho-red);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background-color: var(--zoho-red);
      color: var(--white);
    }
    .btn-primary:hover {
      background-color: #c41f21;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(228, 37, 39, 0.3);
    }
    .btn-outline {
      background-color: transparent;
      color: var(--zoho-red);
      border: 2px solid var(--zoho-red);
    }
    .btn-outline:hover {
      background-color: var(--zoho-red);
      color: var(--white);
    }
    .btn-sm {
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    .card {
      background-color: var(--white);
      border-radius: 12px;
      box-shadow: 0 2px 8px var(--shadow-color);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .card-header {
      background-color: var(--zoho-red);
      color: var(--white);
      padding: 15px 20px;
      font-weight: 700;
    }
    .card-body {
      padding: 20px;
    }
    .card-title {
      margin: 0;
      font-size: 1.2rem;
    }
    .text-center { text-align: center; }
    .mb-4 { margin-bottom: 30px; }
    h1 {
      color: var(--zoho-red);
      font-weight: 900;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .chat-container {
      background-color: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 16px var(--shadow-color);
      overflow: hidden;
      height: 600px;
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: var(--zoho-gray);
    }
    .message {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message > div:first-child {
      padding: 15px 20px;
      border-radius: 12px;
      max-width: 85%;
      word-wrap: break-word;
    }
    .message-user > div:first-child {
      background-color: var(--zoho-red);
      color: var(--white);
      align-self: flex-end;
      margin-left: auto;
    }
    .message-ai > div:first-child {
      background-color: var(--white);
      color: var(--zoho-dark);
      border: 2px solid var(--border-color);
      align-self: flex-start;
    }
    .message-time {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 5px;
      padding: 0 5px;
    }
    .chat-input-container {
      display: flex;
      gap: 10px;
      padding: 20px;
      background-color: var(--white);
      border-top: 2px solid var(--border-color);
    }
    .chat-input {
      flex: 1;
      padding: 12px 20px;
      border: 2px solid var(--border-color);
      border-radius: 25px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }
    .chat-input:focus {
      border-color: var(--zoho-red);
      box-shadow: 0 0 0 3px rgba(228, 37, 39, 0.1);
    }
    .loading-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: var(--zoho-red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="header no-print">
    <div class="header-content">
      <div class="logo-container">
        <img src="https://ik.imagekit.io/weo7pcw8v/image-removebg-preview%20(4).png?updatedAt=1761788896176" alt="e& Egypt" class="logo logo-left">
        <img src="https://ik.imagekit.io/weo7pcw8v/image-removebg-preview%20(3).png?updatedAt=1761788895997" alt="Zoho" class="logo logo-right">
      </div>
      <div class="user-info">
        <a href="#" class="btn btn-outline btn-sm" style="margin-left: 15px;">
          <i class="fas fa-home"></i> الرئيسية
        </a>
        <i class="fas fa-user-circle"></i>
        <span id="userName">مستخدم تجريبي</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="text-center mb-4">
      <h1><i class="fas fa-brain"></i> e& Smart - المساعد الذكي</h1>
      <p style="color: var(--text-secondary); font-size: 1.1rem;">مساعدك الذكي للاستفسارات حول تطبيقات Zoho والأسعار</p>
    </div>

    <div class="card mb-4">
      <div class="card-header">
        <h3 class="card-title"><i class="fas fa-rocket"></i> أسئلة سريعة</h3>
      </div>
      <div class="card-body">
        <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
          <button class="btn btn-primary btn-sm" onclick="askQuickQuestion('CRM')">
            <i class="fas fa-users"></i> CRM
          </button>
          <button class="btn btn-primary btn-sm" onclick="askQuickQuestion('Books')">
            <i class="fas fa-calculator"></i> المحاسبة
          </button>
          <button class="btn btn-primary btn-sm" onclick="askQuickQuestion('Desk')">
            <i class="fas fa-headset"></i> دعم العملاء
          </button>
          <button class="btn btn-primary btn-sm" onclick="askQuickQuestion('Inventory')">
            <i class="fas fa-boxes"></i> المخزون
          </button>
          <button class="btn btn-primary btn-sm" onclick="askQuickQuestion('الأسعار')">
            <i class="fas fa-tag"></i> الأسعار
          </button>
        </div>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="message message-ai">
          <div>مرحباً! أنا المساعد الذكي لـ e& Smart. كيف يمكنني مساعدتك اليوم؟</div>
          <div class="message-time">الآن</div>
        </div>
      </div>
      <div class="chat-input-container">
        <input type="text" class="chat-input" id="chatInput" placeholder="اكتب سؤالك هنا...">
        <button class="btn btn-primary" id="sendBtn">
          <i class="fas fa-paper-plane"></i> إرسال
        </button>
      </div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay" style="display: none;">
    <div class="loading-spinner"></div>
  </div>

<script>
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const loadingOverlay = document.getElementById('loadingOverlay');

// ==========================================
// KNOWLEDGE BASE
// ==========================================
const KNOWLEDGE_BASE = {
  apps: {
    crm: {
      name: "Zoho CRM",
      nameAr: "إدارة علاقات العملاء",
      description: "نظام شامل لإدارة المبيعات والعملاء وتتبع الفرص البيعية",
      features: ["إدارة جهات الاتصال", "تتبع الفرص", "أتمتة المبيعات", "تقارير وتحليلات", "تكامل مع البريد"],
      benefits: ["زيادة المبيعات", "تحسين خدمة العملاء", "توفير الوقت"],
      pricing: { standard: 840, professional: 1680, enterprise: 2520 },
      industries: ["المبيعات", "التسويق"]
    },
    books: {
      name: "Zoho Books",
      nameAr: "المحاسبة المالية",
      description: "برنامج محاسبة متكامل للفواتير والمصروفات",
      features: ["الفواتير", "المصروفات", "التقارير الضريبية", "ربط البنوك", "فواتير متكررة"],
      benefits: ["دقة محاسبية", "توفير الوقت", "تحكم مالي كامل"],
      pricing: { standard: 630, professional: 1260, premium: 1890 },
      industries: ["المالية", "المحاسبة"]
    },
    desk: {
      name: "Zoho Desk",
      nameAr: "دعم العملاء",
      description: "نظام خدمة ودعم العملاء",
      features: ["تذاكر الدعم", "قاعدة المعرفة", "الدردشة الحية", "SLA", "تحليلات رضا العملاء"],
      benefits: ["رضا العملاء", "حل سريع", "تحسين تجربة الدعم"],
      pricing: { standard: 560, professional: 1260, enterprise: 2100 },
      industries: ["الخدمة", "الدعم الفني"]
    },
    inventory: {
      name: "Zoho Inventory",
      nameAr: "إدارة المخزون",
      description: "نظام متكامل لإدارة المخزون والطلبات والشحن",
      features: ["تتبع المخزون", "إدارة الطلبات", "باركود", "تكامل المتاجر", "مستودعات متعددة"],
      benefits: ["تقليل الفاقد", "تحسين الكفاءة", "دقة التتبع"],
      pricing: { standard: 700, professional: 1400, premium: 2100 },
      industries: ["التجارة", "التصنيع"]
    }
  }
};

// ==========================================
// Response Generators
// ==========================================
function generateAppDetails(appKey) {
  const app = KNOWLEDGE_BASE.apps[appKey];
  if (!app) return 'عذراً، لم أجد معلومات عن هذا التطبيق.';
  let response = `**${app.nameAr} (${app.name})**\n\n${app.description}\n\n`;
  response += `**🎯 المميزات:**\n` + app.features.map(f => `• ${f}`).join('\n') + '\n\n';
  response += `**💪 الفوائد:**\n` + app.benefits.map(b => `• ${b}`).join('\n') + '\n\n';
  response += `**💰 الأسعار:**\n` + Object.entries(app.pricing).map(([tier, price]) => `• ${tier}: ${price} جنيه`).join('\n');
  return response;
}

function generateWorkflowTips(appKey) {
  const workflows = {
    crm: ["تسجيل العملاء المحتملين", "توزيع العملاء حسب القطاع", "متابعة مراحل الصفقة", "إرسال عروض الأسعار", "تحليل الأداء"],
    books: ["إصدار الفواتير", "ربط الحسابات البنكية", "إعداد تقارير مالية", "إدارة الضرائب", "مزامنة مع CRM"],
    desk: ["استقبال التذاكر", "توزيع حسب الأولوية", "تتبع وقت الاستجابة", "إنشاء قاعدة معرفة", "تحليل رضا العملاء"],
    inventory: ["إدارة المنتجات", "تتبع الطلبات", "تنبيهات نفاد المخزون", "ربط مع Books وCRM", "تحسين سلسلة التوريد"]
  };
  const tips = workflows[appKey];
  if (!tips) return "";
  return `\n\n**🔄 سير العمل المقترح لقسم ${appKey.toUpperCase()}**\n` + tips.map(t => `• ${t}`).join('\n');
}

function generatePricingInfo() {
  return `**💰 الأسعار:**\n• CRM: 840–2520 جنيه\n• Books: 630–1890 جنيه\n• Desk: 560–2100 جنيه\n• Inventory: 700–2100 جنيه\n\n**Zoho One:** 4200 جنيه/مستخدم/شهر يشمل كل التطبيقات`;
}

function generateClosingTips() {
  return `\n\n**📌 تذكير للبائع:**\nإذا لاحظت اهتمام من العميل — مثل طرح أسئلة أو طلب عرض — فهذا وقت الإغلاق.\n\n**💼 نصائح سريعة للإغلاق:**\n• اسأل: "هل يناسبكم هذا الحل؟"\n• قدم عرضاً محدوداً\n• استخدم قصص نجاح\n• أكد على الدعم\n• اطلب القرار: "هل نبدأ اليوم؟"`;
}

// ==========================================
// AI Response Logic
// ==========================================
async function getSimulatedResponse(question) {
  await new Promise(resolve => setTimeout(resolve, 1500));
  const q = question.toLowerCase();
  let response = "";

  if (q.includes('crm') || q.includes('علاقات العملاء')) {
    response = generateAppDetails('crm') + generateWorkflowTips('crm');
  } else if (q.includes('books') || q.includes('محاسبة')) {
    response = generateAppDetails('books') + generateWorkflowTips('books');
  } else if (q.includes('desk') || q.includes('دعم العملاء')) {
    response = generateAppDetails('desk') + generateWorkflowTips('desk');
  } else if (q.includes('inventory') || q.includes('مخزون')) {
    response = generateAppDetails('inventory') + generateWorkflowTips('inventory');
  } else if (q.includes('سعر') || q.includes('price')) {
    response = generatePricingInfo();
  } else {
    response = "شكراً لسؤالك! يمكنني مساعدتك في معرفة تفاصيل تطبيقات Zoho، الأسعار، الفوائد، وسير العمل حسب القسم.";
  }

  response += generateClosingTips();
  return response;
}

// ==========================================
// Chat Rendering
// ==========================================
function addMessage(text, sender) {
  const messageDiv = document.createElement('div');
  messageDiv.className = `message message-${sender}`;
  const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  messageDiv.innerHTML = `<div>${text.replace(/\n/g, '<br>')}</div><div class="message-time">${time}</div>`;
  chatMessages.appendChild(messageDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// ==========================================
// Send Message
// ==========================================
sendBtn.addEventListener('click', handleSend);
chatInput.addEventListener('keypress', e => { if (e.key === 'Enter') handleSend(); });

async function handleSend() {
  const message = chatInput.value.trim();
  if (!message) return;
  addMessage(message, 'user');
  chatInput.value = '';
  loadingOverlay.style.display = 'flex';
  try {
    const reply = await getSimulatedResponse(message);
    addMessage(reply, 'ai');
  } catch (err) {
    addMessage('حدث خطأ، حاول مرة أخرى.', 'ai');
  } finally {
    loadingOverlay.style.display = 'none';
  }
}

// ==========================================
// Quick Questions Handler
// ==========================================
function askQuickQuestion(type) {
  const questions = {
    'CRM': 'أريد معرفة المزيد عن نظام CRM',
    'Books': 'أحتاج معلومات عن برنامج المحاسبة',
    'Desk': 'أريد تفاصيل عن نظام دعم العملاء',
    'Inventory': 'أحتاج معلومات عن إدارة المخزون',
    'الأسعار': 'ما هي أسعار تطبيقات Zoho؟'
  };
  
  const question = questions[type];
  if (question) {
    chatInput.value = question;
    handleSend();
  }
}
</script>
</body>
</html>
